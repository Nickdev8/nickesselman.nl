server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  if ($request_uri = "/index.html") {
    return 301 /;
  }

  if ($arg_page != "") {
    return 301 https://nickesselman.nl/;
  }

  if ($arg_project != "") {
    return 301 https://nickesselman.nl/;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.nickesselman.nl https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location = /portfolio { return 301 /#work; }
  location = /portfolio/ { return 301 /#work; }
  location = /404.html {
    internal;
  }

  error_page 404 /404.html;

  location ~* \.(?:avif|webp|png|jpg|jpeg|svg|ico|mp4|js|css)$ {
    expires 1y;
    try_files $uri =404;
  }

  location ~* \.(?:html|xml|txt)$ {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

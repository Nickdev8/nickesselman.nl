map $uri $project_media_robots {
  default "";
  ~*^/projects/.*\.(?:avif|webp|png|jpe?g|gif|svg|mp4)$ "noindex";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  if ($host = www.nickesselman.nl) {
    return 301 https://nickesselman.nl$request_uri;
  }

  if ($request_uri = "/index.html") {
    return 301 /;
  }

  if ($arg_page != "") {
    return 301 https://nickesselman.nl/;
  }

  if ($arg_project != "") {
    return 301 https://nickesselman.nl/;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Browsers honor HSTS only over HTTPS; TLS terminates at the upstream proxy.
  add_header Strict-Transport-Security "max-age=300" always;
  add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'" always;
  add_header X-Robots-Tag $project_media_robots always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.nickesselman.nl https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location = /portfolio { return 301 /#work; }
  location = /portfolio/ { return 301 /#work; }
  location = /404.html {
    internal;
  }

  location = /api/cv-download {
    limit_except POST { deny all; }
    proxy_ssl_server_name on;
    proxy_set_header Content-Type text/plain;
    proxy_set_body "Client IP (server connection): $remote_addr\nCF-Connecting-IP header: $http_cf_connecting_ip\nX-Forwarded-For header: $http_x_forwarded_for\nCF-IPCountry header: $http_cf_ipcountry\n$request_body";
    proxy_pass https://ntfy.sh/nickesselman-nickcvdownload;
  }

  error_page 404 /404.html;

  # Keep project media crawlable so bots can read its noindex header.
  location ~* ^/projects/.*\.(?:avif|webp|png|jpe?g|gif|svg|mp4)$ {
    expires 1d;
    try_files $uri =404;
  }

  location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
    expires 1y;
    try_files $uri =404;
  }

  location ~* \.(?:avif|webp|png|jpg|jpeg|svg|ico|mp4|js|css)$ {
    expires 1d;
    try_files $uri =404;
  }

  location ~* \.(?:html|xml|txt)$ {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
